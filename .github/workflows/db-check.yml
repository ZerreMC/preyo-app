# Destino: .github/workflows/db-check.yml  (nuevo)
# Valida que TODAS las migraciones aplican limpias desde cero en un Postgres efímero
# (Supabase local en el runner) y que toda tabla public tiene RLS activada.
# Fuente de verdad = repo, NO un entorno externo. El seed ya no falla sin usuario
# (20_price_entries.sql omite los precios demo si no hay auth.users).
name: DB Check

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/config.toml"
      - "scripts/db/**"
      - ".github/workflows/db-check.yml"
  push:
    branches: [main, mvp/integration, develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/config.toml"
      - "scripts/db/**"
      - ".github/workflows/db-check.yml"

permissions:
  contents: read

concurrency:
  group: db-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Excluimos servicios pesados/flaky (analytics/logflare fue el que petaba en el LXC).
      - name: Start Supabase (servicios mínimos)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Reset — todas las migraciones aplican desde cero (+ seed)
        run: supabase db reset

      - name: RLS activada en todas las tablas public
        run: |
          MISSING=$(supabase db query --local -o csv "
            SELECT c.relname
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relkind = 'r'
              AND NOT c.relrowsecurity
              AND c.relname NOT IN ('schema_migrations');
          " | tail -n +2 | tr -d '\r')
          if [ -n "$MISSING" ]; then
            echo "::error::Tablas public SIN RLS:"; echo "$MISSING"; exit 1
          fi
          echo "OK: RLS activa en todas las tablas public."

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
