# Destino: .github/workflows/deploy-production.yml  (último, con aprobación manual)
# Producción = Supabase Cloud. environment 'production' debe tener required reviewers
# (Settings > Environments) para que el deploy exija aprobación.
#
# Secrets: SUPABASE_ACCESS_TOKEN
# Vars:    SUPABASE_PROJECT_REF, PROD_URL
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen a desplegar (p.ej. v1.2.3)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Resolver tag e imagen
        id: meta
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar que la imagen existe
        run: docker pull "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"

      # ── Migraciones a Cloud (expand/contract; sin cambios destructivos sin revisar) ──
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations (Cloud)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push --linked

      - name: Deploy
        run: |
          echo "Desplegar ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
          # TODO: comando real de tu hosting (compose pull/up, kubectl, etc.)

      - name: Smoke test
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PROD_URL }}/api/health" || echo 000)
          [ "$code" = "200" ] || { echo "::error::smoke prod $code — considera rollback al tag anterior"; exit 1; }
          echo "OK prod"
