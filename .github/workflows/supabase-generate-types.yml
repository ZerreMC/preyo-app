name: supabase-generate-types

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify generated types match schema
        run: |
          supabase gen types typescript --project-id xixrngrajnvfqqopwhun > src/shared/api/supabase/types/database.types.ts
          git diff --ignore-space-at-eol --exit-code
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}