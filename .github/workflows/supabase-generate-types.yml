name: supabase-generate-types

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify generated types match Supabase schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p src/shared/api/supabase/types
          supabase gen types typescript --project-id "${{ vars.SUPABASE_PROJECT_REF }}" > src/shared/api/supabase/types/database.types.ts
          git diff --ignore-space-at-eol --exit-code