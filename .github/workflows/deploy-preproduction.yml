# Destino: .github/workflows/deploy-preproduction.yml  (nuevo, cuando tengas preprod)
# Preproducción = LXC self-hosted (NO un proyecto Supabase Cloud), así que las migraciones
# se aplican con TU runner (pnpm db:migrate:remote) por SSH a través de Tailscale.
#
# Secrets requeridos (Settings > Secrets):
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET   -> Tailscale OAuth (o usa TAILSCALE_AUTHKEY)
#   PREYO_SSH_KEY                          -> clave privada SSH autorizada en el LXC
# Vars requeridas:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, PREPROD_URL
# (PREYO_REMOTE_HOST/USER usan los defaults del runner: 100.69.204.118 / yisus)
name: Deploy Preproduction

on:
  push:
    branches: [develop]   # ajusta a tu rama de preprod

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preproduction
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Repo en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE }}:develop
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Migraciones al LXC por el runner del repo (vía Tailscale + SSH) ──
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.PREYO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Apply migrations (LXC)
        run: node scripts/db/apply-migrations.mjs --yes

      - name: Smoke test
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PREPROD_URL }}/api/health" || echo 000)
          [ "$code" = "200" ] || { echo "::error::smoke preprod $code"; exit 1; }
          echo "OK preprod"
